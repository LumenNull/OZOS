name: O.Z.O.S Mull Mutation Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mull-mutation-analysis:
    name: Mull LLVM IR Mutation Analysis (Clang-19)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang-19 and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg curl
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-19 libclang-19-dev llvm-19

      - name: Install Mull from Official Cloudsmith Repository
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y mull-19 || sudo apt-get install -y mull

      - name: Verify Mull Installation
        run: |
          which mull-runner-19 || which mull-runner || true
          mull-runner-19 --version || mull-runner --version || true

      - name: Build and Run Mull Mutation Testing on libozos Test Suite
        run: |
          # Locate mull-ir-frontend plugin
          MULL_PLUGIN=$(find /usr -name "libmull-ir-frontend-19.so" -o -name "libmull-ir-frontend.so" 2>/dev/null | head -n 1)
          echo "Found Mull Plugin: $MULL_PLUGIN"

          # Compile test_libozos with Mull Clang pass plugin
          clang-19 -O0 -g -grecord-command-line \
            -fpass-plugin="$MULL_PLUGIN" \
            -Icore -I. \
            tests/test_libozos.c core/tweetnacl.c core/ozos_hardened_core.cpp \
            -lm -o test_libozos_mull

          # Run Mull Runner
          mull-runner-19 ./test_libozos_mull \
            --report-name=libozos_mutation_report \
            --report-dir=mutation_reports || \
          mull-runner ./test_libozos_mull \
            --report-name=libozos_mutation_report \
            --report-dir=mutation_reports

      - name: Build and Run Mull Mutation Testing on Omni-PHY Test Suite
        run: |
          MULL_PLUGIN=$(find /usr -name "libmull-ir-frontend-19.so" -o -name "libmull-ir-frontend.so" 2>/dev/null | head -n 1)
          clang-19 -O0 -g -grecord-command-line \
            -fpass-plugin="$MULL_PLUGIN" \
            -Icore -I. \
            tests/test_omni_phy.c \
            -lm -o test_omni_phy_mull

          mull-runner-19 ./test_omni_phy_mull \
            --report-name=omni_phy_mutation_report \
            --report-dir=mutation_reports || \
          mull-runner ./test_omni_phy_mull \
            --report-name=omni_phy_mutation_report \
            --report-dir=mutation_reports

      - name: Upload Mull Mutation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-mutation-reports
          path: mutation_reports/
